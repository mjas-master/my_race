name: Deploy Frontend (dev)

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/frontend-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-develop
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/ubuntu/my_race
  # 웹은 Caddy 가 /v1/* 을 백엔드로 프록시하므로 같은 출처(빈값=상대경로). 다른 서버라면 vars.WEB_API_BASE_URL 지정
  WEB_API_BASE_URL: ${{ vars.WEB_API_BASE_URL || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: '[ -d test ] && flutter test || echo "no tests"'

  deploy-web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter Web
        working-directory: frontend
        run: |
          flutter pub get
          [ -d web ] || flutter create . --platforms=web
          flutter build web --release --dart-define=API_BASE_URL="${WEB_API_BASE_URL}"

      - name: Upload web build, Caddyfile, compose
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "frontend/build/web/*,frontend/Caddyfile,deploy/docker-compose.yml"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Swap static files & reload Caddy
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_DIR
          script: |
            set -eu
            cd "${DEPLOY_DIR}"
            test -f build/web/index.html
            mkdir -p html
            find html -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a build/web/. html/
            rm -rf build
            test -s html/index.html
            test -s html/flutter_bootstrap.js

            docker compose up -d frontend
            docker compose exec -T frontend caddy validate --config /etc/caddy/Caddyfile
            docker compose exec -T frontend caddy reload --config /etc/caddy/Caddyfile